<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/science-corner/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f0e4">
  <meta name="description" content="Science Corner: courses on atoms and molecules and on evolution, with lessons, activities, and links to trusted sources.">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem("science-corner-v1") || "{}").theme;
      if (!saved && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) saved = "night";
      document.documentElement.setAttribute("data-theme", saved === "night" ? "night" : "lamp");
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "lamp");
    }
  </script>
</head>

  <noscript>

  </noscript>
  <script src="catalog.js"></script>

  <script src="courses/evolution.js"></script>
  <script src="app.js"></script>
</body>
</html>
